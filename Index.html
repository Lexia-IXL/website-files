<title>Frogie's Arcade</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at top, #19352b 0%, #101715 45%, #080b0a 100%);
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
        font-family: inherit;
    }

    /* =========================
       LOADING SCREEN
    ========================= */

    #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #101715;

        text-align: center;

        opacity: 1;
        visibility: visible;

        transition:
            opacity 0.6s ease,
            visibility 0.6s ease;
    }

    #loading-screen.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .spinner {
        display: flex;
        gap: 9px;
        margin-bottom: 30px;
    }

    .spinner div {
        width: 15px;
        height: 15px;

        border-radius: 50%;
        background: #00ffa6;

        animation: loadingBounce 0.8s infinite alternate;
    }

    .spinner div:nth-child(2) {
        animation-delay: 0.15s;
    }

    .spinner div:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes loadingBounce {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(-14px);
        }
    }

    #messageforyou {
        max-width: 800px;
        padding: 0 20px;

        font-size: 22px;
        line-height: 1.5;
    }

    #loading-text {
        color: #9ca9a4;
        font-size: 15px;
    }

    #skiploading {
        color: #00ffa6;
        cursor: pointer;
        text-decoration: underline;
    }

    /* =========================
       HEADER
    ========================= */

    #header {
        position: sticky;
        top: 0;
        z-index: 1000;

        height: 72px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 22px;

        background: rgba(16, 23, 21, 0.94);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(10px);
    }

    #brand {
        display: flex;
        align-items: center;
        gap: 12px;

        cursor: pointer;

        user-select: none;
    }

    #brand-icon {
        width: 40px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: #00ffa6;
        color: #07110d;

        font-size: 23px;
    }

    #brand-name {
        color: #00ffa6;
        font-size: 20px;
        font-weight: bold;
    }

    .header-buttons {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .header-button {
        width: 43px;
        height: 43px;

        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 11px;

        background: #18211e;
        color: white;

        font-size: 19px;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            background 0.2s ease;
    }

    .header-button:hover {
        transform: translateY(-2px);
        background: #22302a;
    }

    /* =========================
       MAIN
    ========================= */

    #main {
        width: min(1050px, 92%);
        margin: 0 auto;

        padding: 70px 0 130px;

        text-align: center;
    }

    #maintitle {
        margin: 0;

        color: #00ffa6;

        font-size: clamp(30px, 6vw, 52px);

        letter-spacing: 1px;

        text-shadow:
            0 0 20px rgba(0, 255, 166, 0.15);
    }

    #subtitle {
        max-width: 650px;

        margin: 18px auto 42px;

        color: #a9b5b0;

        font-size: 16px;
        line-height: 1.6;
    }

    /* =========================
       APP BUTTONS
    ========================= */

    #apps {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;

        gap: 15px;

        margin-bottom: 45px;
    }

    .app-button {
        width: 105px;
        min-height: 105px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: 8px;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 17px;

        background: #151e1b;
        color: white;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            border-color 0.2s ease,
            background 0.2s ease;
    }

    .app-button:hover {
        transform: translateY(-6px);

        border-color: #00ffa6;

        background: #1c2924;
    }

    .app-icon {
        width: 50px;
        height: 50px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 14px;

        background: #25332d;

        font-size: 25px;
    }

    .app-name {
        font-size: 13px;
        font-weight: bold;
    }

    /* =========================
       SEARCH
    ========================= */

    #search-section {
        width: min(700px, 100%);

        margin: 0 auto;

        padding: 25px;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;

        background: rgba(21, 30, 27, 0.8);

        box-shadow:
            0 15px 50px rgba(0, 0, 0, 0.25);
    }

    #search-form {
        display: flex;
        gap: 10px;
    }

    #teacher-lookup {
        flex: 1;

        min-width: 0;

        padding: 15px 17px;

        border: 1px solid #34423c;
        border-radius: 10px;

        outline: none;

        background: #0f1513;
        color: white;

        font-size: 16px;
    }

    #teacher-lookup:focus {
        border-color: #00ffa6;
    }

    #teacher-lookup::placeholder {
        color: #718078;
    }

    #search-button {
        padding: 0 22px;

        border: 0;
        border-radius: 10px;

        background: #00ffa6;
        color: #07110d;

        font-weight: bold;

        cursor: pointer;

        transition: transform 0.2s ease;
    }

    #search-button:hover {
        transform: scale(1.03);
    }

    #regionchanger {
        width: 100%;

        margin-top: 12px;

        padding: 12px;

        border: 1px solid #34423c;
        border-radius: 9px;

        background: #0f1513;
        color: white;

        outline: none;
    }

    /* =========================
       DISCORD BUTTON
    ========================= */

    #discord {
        margin-top: 25px;

        padding: 14px 24px;

        border: 0;
        border-radius: 10px;

        background: #5865f2;
        color: white;

        font-weight: bold;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            opacity 0.2s ease;
    }

    #discord:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    /* =========================
       PRIVACY
    ========================= */

    #privacy {
        display: inline-block;

        margin-top: 25px;

        color: #00ffa6;

        text-decoration: none;
    }

    #privacy:hover {
        text-decoration: underline;
    }

    /* =========================
       FOOTER
    ========================= */

    #footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;

        min-height: 65px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 22px;

        background: rgba(16, 23, 21, 0.96);

        border-top: 1px solid rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(10px);
    }

    #online {
        margin: 0;

        color: #82908a;

        font-size: 14px;
    }

    #footer-buttons {
        display: flex;
        gap: 8px;
    }

    .footer-button {
        width: 42px;
        height: 42px;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;

        background: #18211e;
        color: white;

        font-size: 19px;

        cursor: pointer;
    }

    /* =========================
       NOTIFICATION
    ========================= */

    #notification {
        position: fixed;

        left: 50%;
        bottom: 85px;

        transform: translateX(-50%) translateY(20px);

        z-index: 9000;

        width: min(450px, 90%);

        padding: 15px 18px;

        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;

        background: #17201c;

        color: white;

        text-align: center;

        opacity: 0;
        visibility: hidden;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease,
            visibility 0.25s ease;
    }

    #notification.show {
        opacity: 1;
        visibility: visible;

        transform: translateX(-50%) translateY(0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

        #header {
            padding: 0 12px;
        }

        #brand-name {
            font-size: 16px;
        }

        #brand-icon {
            width: 35px;
            height: 35px;
        }

        .header-button {
            width: 38px;
            height: 38px;
        }

        #main {
            padding-top: 45px;
        }

        #apps {
            gap: 9px;
        }

        .app-button {
            width: 88px;
            min-height: 90px;
        }

        .app-icon {
            width: 42px;
            height: 42px;
        }

        #search-form {
            flex-direction: column;
        }

        #search-button {
            padding: 13px;
        }

        #footer {
            padding: 0 12px;
        }

        #messageforyou {
            font-size: 17px;
        }
    }
</style>

<script>

    /*
     * Open a website in a new tab.
     */
    function openLink(url) {

        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

    }


    /*
     * Go back to the homepage.
     */
    function goHome() {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
     * Search using DuckDuckGo.
     */
    function searchWeb(query) {

        const url =
            "https://duckduckgo.com/?q=" +
            encodeURIComponent(query);

        openLink(url);

    }


    /*
     * Loading screen.
     */
    function loadthething() {

        const loadingScreen =
            document.getElementById("loading-screen");

        loadingScreen.classList.add("fade-out");

    }


    /*
     * Automatically remove the loading screen.
     */
    window.addEventListener("load", function() {

        setTimeout(function() {

            loadthething();

        }, 1200);

    });


    /*
     * Search form.
     */
    document
        .getElementById("search-form")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const input =
                document.getElementById("teacher-lookup");

            let value =
                input.value.trim();

            if (!value) {

                showMessage("Please enter something to search.");

                return;

            }


            let url;


            /*
             * If the user entered a complete URL,
             * open that URL.
             */
            if (
                value.startsWith("https://") ||
                value.startsWith("http://")
            ) {

                url = value;

            }


            /*
             * If it looks like a domain,
             * add HTTPS automatically.
             */
            else if (
                value.includes(".") &&
                !value.includes(" ")
            ) {

                url = "https://" + value;

            }


            /*
             * Otherwise search DuckDuckGo.
             */
            else {

                url =
                    "https://duckduckgo.com/?q=" +
                    encodeURIComponent(value);

            }


            openLink(url);

        });


    /*
     * Save selected region.
     */
    const regionSelect =
        document.getElementById("regionchanger");


    const savedRegion =
        localStorage.getItem("calculusregion");


    if (savedRegion) {

        regionSelect.value = savedRegion;

    }


    regionSelect.addEventListener(
        "change",
        function() {

            localStorage.setItem(
                "calculusregion",
                this.value
            );

            showMessage(
                "Region saved: " + this.options[this.selectedIndex].text
            );

        }
    );


    /*
     * Small notification system.
     */
    let notificationTimer;


    function showMessage(message) {

        const notification =
            document.getElementById("notification");


        notification.textContent = message;

        notification.classList.add("show");


        clearTimeout(notificationTimer);


        notificationTimer =
            setTimeout(function() {

                notification.classList.remove("show");

            }, 3000);

    }

</script>
