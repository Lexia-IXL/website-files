```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f7f3;
        color: #222;
        text-align: center;
    }

    header {
        background: #1f7a4d;
        color: white;
        padding: 40px 20px;
    }

    header h1 {
        margin: 0 0 10px;
        font-size: 40px;
    }

    header p {
        margin: 0;
        font-size: 18px;
    }

    main {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .button {
        display: inline-block;
        margin: 10px;
        padding: 14px 24px;
        background: #1f7a4d;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
    }

    .button:hover {
        background: #155c39;
    }

    footer {
        margin-top: 50px;
        padding: 20px;
        color: #666;
    }
</style>
```

</head>

<body>

```
<header>
    <h1>My Website</h1>
    <p>Welcome to my website!</p>
</header>

<main>
    <div class="card">
        <h2>Welcome</h2>
        <p>
            This is my website hosted using GitHub and delivered through jsDelivr.
        </p>

        <a class="button" href="https://example.com" target="_blank">

        </a>
    </div>
</main>

<footer>

</footer>
